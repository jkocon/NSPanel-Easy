---
# Kurantowka: user interface language selectable at runtime (Polski, English, Magyar, Slovenčina, Čeština, Deutsch, Français, Español).
#
# - "Language" select in Home Assistant; Polish after every restart (the default language).
# - Globe button (home.bt_lang) opens the language picker on the panel.
# - Every change fires the `language_changed` event, so the Blueprint sends its texts again in the new language.
substitutions:
  TAG_UI_LANGUAGE: nspanel.ui_language
  UI_LANGUAGE_CONTEXT: ui_language

select:
  - id: ui_language_select
    platform: template
    name: Language
    icon: mdi:translate
    entity_category: config
    optimistic: true
    restore_value: false  # Polish after every restart; guests pick their language with the globe
    initial_option: Polski
    options:
      - Polski
      - English
      - Magyar
      - Slovenčina
      - Čeština
      - Deutsch
      - Français
      - Español
    on_value:
      then:
        - lambda: |-
            const uint8_t index = static_cast<uint8_t>(i);
            const bool changed = ui_language() != index;
            ui_language() = index < UI_LANGUAGE_COUNT ? index : 0;
            ESP_LOGI("${TAG_UI_LANGUAGE}", "Language: %s (%s)", x.c_str(), ui_language_code(ui_language()));
            if (!changed) return;
            ui_language_apply->execute();

script:
  - id: ui_language_apply
    mode: restart
    then:
      - lambda: |-
          // Translated states of the home values, as set at boot
          home_value_texts_set(${UI_UNAVAILABLE},
                               ${UI_UNKNOWN},
                               ${UI_CLIMATE_STATES_ON},
                               ${UI_CLIMATE_STATES_OFF});
          #ifdef NSPANEL_EASY_SUBSCRIBE
          // Button pages, from the setups the Blueprint sent once per session
          for (const auto &item : ui_buttons_setups()) {
            const UiButtonsSetup &setup = item.second;
            buttons_setup(item.first, ui_translate(setup.page_label), ui_translate_all(setup.labels), setup.state_values,
                          setup.confirm, setup.icon_font, setup.temperature_unit, ${LANG_BYTES_PER_CHAR});
          }  // for (button page setups)
          #endif  // NSPANEL_EASY_SUBSCRIBE
          // Date and weekday names on the home page and screensaver
          refresh_datetime->execute();
          // Static labels of the page being shown
          ui_language_labels->execute();
          // The Blueprint renders the page being shown again; its texts are translated by `ui_translate`.
          // No "boot" event here: it reruns the panel's boot sequence (version check, wake-up page) and,
          // racing with the language picker, ended on the boot page and a restart.
          fire_ha_event("language_changed", {{"language", ui_language_code(ui_language())}});
          if (current_page_id != get_page_id("boot") and current_page_id != get_page_id("popup_select")) {
            fire_ha_event("page_changed", {{"page", page_names[current_page_id]}, {"entity", detailed_entity->state.c_str()}});
          }  // if (page to render again)

  # Texts the TFT holds as fixed Polish labels
  - id: ui_language_labels
    mode: restart
    then:
      - lambda: |-
          if (current_page_id == get_page_id("climate")) {
            disp1->set_component_text("temp_header", ui_text("Temperatura:", "Temperature:", "Hőmérséklet:", "Teplota:", "Teplota:", "Temperatur:", "Température :", "Temperatura:"));
            disp1->set_component_text("label_current", ui_text("Aktualna", "Current", "Jelenlegi", "Aktuálna", "Aktuální", "Aktuell", "Actuelle", "Actual"));
            disp1->set_component_text("label_target", ui_text("Zadana", "Target", "Beállított", "Nastavená", "Nastavená", "Soll", "Consigne", "Objetivo"));
            // Room name: the title of the button that opened the page
            if (!details_overlap.title.empty() and details_overlap.entity == detailed_entity->state) {
              disp1->set_component_text("page_label", ui_translate(details_overlap.title).c_str());
            }  // if (button title)
          } else if (current_page_id == get_page_id("home")) {
            disp1->set_component_font("bt_lang", id(home_custom_buttons_font_id));
            disp1->set_component_text("bt_lang", Icons::MDI_WEB);
          }  // if (current_page_id)

  - id: ui_language_picker_open
    mode: single
    then:
      - lambda: |-
          static const char *const names[UI_LANGUAGE_COUNT] = {"Polski", "English", "Magyar", "Slovenčina", "Čeština", "Deutsch", "Français", "Español"};
          std::vector<std::string> options(names, names + UI_LANGUAGE_COUNT);
          popup_select_cache_entity = "${UI_LANGUAGE_CONTEXT}";
          popup_select_cache_context = "${UI_LANGUAGE_CONTEXT}";
          popup_select_cache_mode = 0;  // Single selection
          popup_select_cache_options = std::move(options);
          popup_select_cache_mask = (1u << ui_language());
          popup_select_open->execute(get_page_id("home"), std::string(ui_text("Język", "Language", "Nyelv", "Jazyk", "Jazyk", "Sprache", "Langue", "Idioma")));

  - id: !extend picker_selected  # Defined by page_popup_select
    then:
      - lambda: |-
          if (context != "${UI_LANGUAGE_CONTEXT}") return;
          if (mask == 0 or value.empty()) return;
          ESP_LOGD("${TAG_UI_LANGUAGE}", "Picked: %s", value.c_str());
          id(ui_language_select).publish_state(value);
          goto_page->execute(get_page_id("home"));

  - id: !extend page_change
    then:
      - lambda: ui_language_labels->execute();

  - id: !extend boot_wrap_up
    then:
      - lambda: |-
          // The globe button opens the language picker; any other click goes to the previous interceptor
          ClickInterceptor previous = click_interceptor;
          click_interceptor = [previous](const std::string &page,
                                         const std::string &event,
                                         const std::string &component) -> bool {
            if (page == "home" and component == "bt_lang") {
              if (event == "short_click" or event == "long_click") ui_language_picker_open->execute();
              return true;
            }  // if (globe button)
            return previous ? previous(page, event, component) : false;
          };
          ui_language_labels->execute();

  - id: !extend dump_config
    then:
      - lambda: >-
          ESP_LOGCONFIG("${TAG_UI_LANGUAGE}", "UI language: %s", ui_language_code(ui_language()));
...
