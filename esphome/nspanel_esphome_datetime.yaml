#####################################################################################################
#####                 NSPanel Easy - https://github.com/edwardtfn/NSPanel-Easy                  #####
#####################################################################################################
##### ESPHOME CORE - DATE & TIME                                                                #####
##### PLEASE only make changes if it is necessary and also the required knowledge is available. #####
##### For normal use with the Blueprint, no changes are necessary.                              #####
#####################################################################################################

---
substitutions:
  ##############################
  ## Change only in your      ##
  ## local yaml substitutions ##
  ##############################
  # SNTP servers (up to 3), separated by ";", as a second time source; blank (default) uses only Home Assistant
  sntp_servers: ""
  ##############################
  TAG_DATETIME: nspanel.datetime
  DATE_FORMAT_DEFAULT: "%A, %d.%m"
  TIME_FORMAT_DEFAULT: "%H:%M"
  TIME_PLACEHOLDER: "--:--"  # Shown instead of the time while the clock is not set
  _pkg_time_sntp:
    time:
      # Second time source: SNTP only needs Wi-Fi, so the clock becomes valid before the API connects
      # (e.g. after a power loss, when the system time is not kept)
      - id: time_sntp
        platform: sntp
        # A list is used as is; a string is split at ";"
        servers: ${ sntp_servers if sntp_servers is not string else (sntp_servers.split(";") | map("trim") | select | list) }
        on_time_sync:
          then:
            - lambda: |-
                ESP_LOGD("${TAG_DATETIME}", "System clock synchronized (SNTP)");
                refresh_datetime->execute();

packages:
  # SNTP as a second time source, only included when `sntp_servers` is set
  time_sntp: ${ _pkg_time_sntp if sntp_servers | length > 0 else {} }

esphome:
  build_flags:
    - -D NSPANEL_EASY_DATETIME

script:
  - id: new_minute
    mode: restart
    then:
      - lambda: |-
          refresh_datetime->execute();
          refresh_wifi_icon->execute(false);

  - id: refresh_datetime
    mode: restart
    then:
      - lambda: |-
          if (system_flags.tft_upload_active) return;  // Do not refresh if uploading TFT

          // Screensaver time with font 12 on the US model is stacked, one line per part
          const auto screensaver_layout = [](std::string &text) {
            if (id(screensaver_display_time_font) == 12 &&
                display_model->current_option() == "${DISPLAY_MODES.US.TEXT}") {
              nspanel_easy::replace_all(text, ":", "\\r");
              nspanel_easy::replace_all(text, " ", "\\r");
            }  // if stacked layout
          };

          // Time
          ESPTime now = id(time_provider).now();
          if (!now.is_valid()) {
            // No clock yet, e.g. after a power loss without Home Assistant or SNTP: show a placeholder
            // instead of leaving the time blank, so the panel doesn't look broken (#735)
            ESP_LOGW("${TAG_DATETIME}", "refresh_datetime: time provider not yet synchronized");
            if (id(screensaver_display_time) && current_page_id == get_page_id("screensaver") &&
                !system_flags.display_start_hold) {
              std::string placeholder = "${TIME_PLACEHOLDER}";
              screensaver_layout(placeholder);
              disp1->set_component_text("text", placeholder.c_str());
              disp1->show_component("text");
            }  // if screensaver showing the time
            disp1->set_component_text("home.meridiem", " ");
            disp1->set_component_text("home.time", "${TIME_PLACEHOLDER}");
            disp1->set_component_text("home.date", " ");
            return;
          }  // if (!now.is_valid())

          std::string time_format_str = id(mui_time_format);

          // Resolve %-H (no-padding 24h hour)
          nspanel_easy::replace_all(time_format_str, "%-H", to_string(static_cast<int>(now.hour)).c_str());

          // Resolve %-I (no-padding 12h hour)
          const int hour12 = (now.hour == 0) ? 12 : (now.hour > 12) ? (now.hour - 12) : now.hour;
          nspanel_easy::replace_all(time_format_str, "%-I", to_string(hour12).c_str());

          const char* const meridiem_text = (now.hour < 12) ? ui_text("${LOCALIZATION.pl.meridiem.am}", "${LOCALIZATION.en.meridiem.am}", "${LOCALIZATION.hu.meridiem.am}", "${LOCALIZATION.sk.meridiem.am}", "${LOCALIZATION.cs.meridiem.am}")
                                                            : ui_text("${LOCALIZATION.pl.meridiem.pm}", "${LOCALIZATION.en.meridiem.pm}", "${LOCALIZATION.hu.meridiem.pm}", "${LOCALIZATION.sk.meridiem.pm}", "${LOCALIZATION.cs.meridiem.pm}");
          const bool has_meridiem = (time_format_str.find("%p") != std::string::npos);

          if (id(screensaver_display_time) && current_page_id == get_page_id("screensaver") &&
              !system_flags.display_start_hold) {
            std::string time_format_str_sleep = time_format_str;
            nspanel_easy::replace_all(time_format_str_sleep, "%p", meridiem_text);
            screensaver_layout(time_format_str_sleep);
            disp1->set_component_text("text", now.strftime(time_format_str_sleep).c_str());
            disp1->show_component("text");
          }

          // Resolve %p for home page — strip from time string, set meridiem component separately
          // Trim both ends after replacement to avoid leading/trailing whitespace
          nspanel_easy::replace_all(time_format_str, "%p", "");
          while (!time_format_str.empty() && time_format_str.front() == ' ')
            time_format_str.erase(time_format_str.begin());
          while (!time_format_str.empty() && time_format_str.back() == ' ')
            time_format_str.pop_back();

          disp1->set_component_text("home.meridiem", has_meridiem ? meridiem_text : " ");
          disp1->set_component_text("home.time", now.strftime(time_format_str).c_str());

          // Date
          render_date->execute("home.date", static_cast<uint32_t>(now.timestamp));

  - id: render_date
    mode: restart
    parameters:
      component: string
      timestamp: uint32_t
    then:
      - lambda: |-
          const char* const weekdays[7] = {
            ui_text("${LOCALIZATION.pl.weekdays.mon}", "${LOCALIZATION.en.weekdays.mon}", "${LOCALIZATION.hu.weekdays.mon}", "${LOCALIZATION.sk.weekdays.mon}", "${LOCALIZATION.cs.weekdays.mon}"),
            ui_text("${LOCALIZATION.pl.weekdays.tue}", "${LOCALIZATION.en.weekdays.tue}", "${LOCALIZATION.hu.weekdays.tue}", "${LOCALIZATION.sk.weekdays.tue}", "${LOCALIZATION.cs.weekdays.tue}"),
            ui_text("${LOCALIZATION.pl.weekdays.wed}", "${LOCALIZATION.en.weekdays.wed}", "${LOCALIZATION.hu.weekdays.wed}", "${LOCALIZATION.sk.weekdays.wed}", "${LOCALIZATION.cs.weekdays.wed}"),
            ui_text("${LOCALIZATION.pl.weekdays.thu}", "${LOCALIZATION.en.weekdays.thu}", "${LOCALIZATION.hu.weekdays.thu}", "${LOCALIZATION.sk.weekdays.thu}", "${LOCALIZATION.cs.weekdays.thu}"),
            ui_text("${LOCALIZATION.pl.weekdays.fri}", "${LOCALIZATION.en.weekdays.fri}", "${LOCALIZATION.hu.weekdays.fri}", "${LOCALIZATION.sk.weekdays.fri}", "${LOCALIZATION.cs.weekdays.fri}"),
            ui_text("${LOCALIZATION.pl.weekdays.sat}", "${LOCALIZATION.en.weekdays.sat}", "${LOCALIZATION.hu.weekdays.sat}", "${LOCALIZATION.sk.weekdays.sat}", "${LOCALIZATION.cs.weekdays.sat}"),
            ui_text("${LOCALIZATION.pl.weekdays.sun}", "${LOCALIZATION.en.weekdays.sun}", "${LOCALIZATION.hu.weekdays.sun}", "${LOCALIZATION.sk.weekdays.sun}", "${LOCALIZATION.cs.weekdays.sun}")
          };
          const char* const weekdays_short[7] = {
            ui_text("${LOCALIZATION.pl.weekdays_short.mon}", "${LOCALIZATION.en.weekdays_short.mon}", "${LOCALIZATION.hu.weekdays_short.mon}", "${LOCALIZATION.sk.weekdays_short.mon}", "${LOCALIZATION.cs.weekdays_short.mon}"),
            ui_text("${LOCALIZATION.pl.weekdays_short.tue}", "${LOCALIZATION.en.weekdays_short.tue}", "${LOCALIZATION.hu.weekdays_short.tue}", "${LOCALIZATION.sk.weekdays_short.tue}", "${LOCALIZATION.cs.weekdays_short.tue}"),
            ui_text("${LOCALIZATION.pl.weekdays_short.wed}", "${LOCALIZATION.en.weekdays_short.wed}", "${LOCALIZATION.hu.weekdays_short.wed}", "${LOCALIZATION.sk.weekdays_short.wed}", "${LOCALIZATION.cs.weekdays_short.wed}"),
            ui_text("${LOCALIZATION.pl.weekdays_short.thu}", "${LOCALIZATION.en.weekdays_short.thu}", "${LOCALIZATION.hu.weekdays_short.thu}", "${LOCALIZATION.sk.weekdays_short.thu}", "${LOCALIZATION.cs.weekdays_short.thu}"),
            ui_text("${LOCALIZATION.pl.weekdays_short.fri}", "${LOCALIZATION.en.weekdays_short.fri}", "${LOCALIZATION.hu.weekdays_short.fri}", "${LOCALIZATION.sk.weekdays_short.fri}", "${LOCALIZATION.cs.weekdays_short.fri}"),
            ui_text("${LOCALIZATION.pl.weekdays_short.sat}", "${LOCALIZATION.en.weekdays_short.sat}", "${LOCALIZATION.hu.weekdays_short.sat}", "${LOCALIZATION.sk.weekdays_short.sat}", "${LOCALIZATION.cs.weekdays_short.sat}"),
            ui_text("${LOCALIZATION.pl.weekdays_short.sun}", "${LOCALIZATION.en.weekdays_short.sun}", "${LOCALIZATION.hu.weekdays_short.sun}", "${LOCALIZATION.sk.weekdays_short.sun}", "${LOCALIZATION.cs.weekdays_short.sun}")
          };
          const char* const months[12] = {
            ui_text("${LOCALIZATION.pl.months.jan}", "${LOCALIZATION.en.months.jan}", "${LOCALIZATION.hu.months.jan}", "${LOCALIZATION.sk.months.jan}", "${LOCALIZATION.cs.months.jan}"), ui_text("${LOCALIZATION.pl.months.feb}", "${LOCALIZATION.en.months.feb}", "${LOCALIZATION.hu.months.feb}", "${LOCALIZATION.sk.months.feb}", "${LOCALIZATION.cs.months.feb}"),
            ui_text("${LOCALIZATION.pl.months.mar}", "${LOCALIZATION.en.months.mar}", "${LOCALIZATION.hu.months.mar}", "${LOCALIZATION.sk.months.mar}", "${LOCALIZATION.cs.months.mar}"), ui_text("${LOCALIZATION.pl.months.apr}", "${LOCALIZATION.en.months.apr}", "${LOCALIZATION.hu.months.apr}", "${LOCALIZATION.sk.months.apr}", "${LOCALIZATION.cs.months.apr}"),
            ui_text("${LOCALIZATION.pl.months.may}", "${LOCALIZATION.en.months.may}", "${LOCALIZATION.hu.months.may}", "${LOCALIZATION.sk.months.may}", "${LOCALIZATION.cs.months.may}"), ui_text("${LOCALIZATION.pl.months.jun}", "${LOCALIZATION.en.months.jun}", "${LOCALIZATION.hu.months.jun}", "${LOCALIZATION.sk.months.jun}", "${LOCALIZATION.cs.months.jun}"),
            ui_text("${LOCALIZATION.pl.months.jul}", "${LOCALIZATION.en.months.jul}", "${LOCALIZATION.hu.months.jul}", "${LOCALIZATION.sk.months.jul}", "${LOCALIZATION.cs.months.jul}"), ui_text("${LOCALIZATION.pl.months.aug}", "${LOCALIZATION.en.months.aug}", "${LOCALIZATION.hu.months.aug}", "${LOCALIZATION.sk.months.aug}", "${LOCALIZATION.cs.months.aug}"),
            ui_text("${LOCALIZATION.pl.months.sep}", "${LOCALIZATION.en.months.sep}", "${LOCALIZATION.hu.months.sep}", "${LOCALIZATION.sk.months.sep}", "${LOCALIZATION.cs.months.sep}"), ui_text("${LOCALIZATION.pl.months.oct}", "${LOCALIZATION.en.months.oct}", "${LOCALIZATION.hu.months.oct}", "${LOCALIZATION.sk.months.oct}", "${LOCALIZATION.cs.months.oct}"),
            ui_text("${LOCALIZATION.pl.months.nov}", "${LOCALIZATION.en.months.nov}", "${LOCALIZATION.hu.months.nov}", "${LOCALIZATION.sk.months.nov}", "${LOCALIZATION.cs.months.nov}"), ui_text("${LOCALIZATION.pl.months.dec}", "${LOCALIZATION.en.months.dec}", "${LOCALIZATION.hu.months.dec}", "${LOCALIZATION.sk.months.dec}", "${LOCALIZATION.cs.months.dec}")
          };
          const char* const months_short[12] = {
            ui_text("${LOCALIZATION.pl.months_short.jan}", "${LOCALIZATION.en.months_short.jan}", "${LOCALIZATION.hu.months_short.jan}", "${LOCALIZATION.sk.months_short.jan}", "${LOCALIZATION.cs.months_short.jan}"), ui_text("${LOCALIZATION.pl.months_short.feb}", "${LOCALIZATION.en.months_short.feb}", "${LOCALIZATION.hu.months_short.feb}", "${LOCALIZATION.sk.months_short.feb}", "${LOCALIZATION.cs.months_short.feb}"),
            ui_text("${LOCALIZATION.pl.months_short.mar}", "${LOCALIZATION.en.months_short.mar}", "${LOCALIZATION.hu.months_short.mar}", "${LOCALIZATION.sk.months_short.mar}", "${LOCALIZATION.cs.months_short.mar}"), ui_text("${LOCALIZATION.pl.months_short.apr}", "${LOCALIZATION.en.months_short.apr}", "${LOCALIZATION.hu.months_short.apr}", "${LOCALIZATION.sk.months_short.apr}", "${LOCALIZATION.cs.months_short.apr}"),
            ui_text("${LOCALIZATION.pl.months_short.may}", "${LOCALIZATION.en.months_short.may}", "${LOCALIZATION.hu.months_short.may}", "${LOCALIZATION.sk.months_short.may}", "${LOCALIZATION.cs.months_short.may}"), ui_text("${LOCALIZATION.pl.months_short.jun}", "${LOCALIZATION.en.months_short.jun}", "${LOCALIZATION.hu.months_short.jun}", "${LOCALIZATION.sk.months_short.jun}", "${LOCALIZATION.cs.months_short.jun}"),
            ui_text("${LOCALIZATION.pl.months_short.jul}", "${LOCALIZATION.en.months_short.jul}", "${LOCALIZATION.hu.months_short.jul}", "${LOCALIZATION.sk.months_short.jul}", "${LOCALIZATION.cs.months_short.jul}"), ui_text("${LOCALIZATION.pl.months_short.aug}", "${LOCALIZATION.en.months_short.aug}", "${LOCALIZATION.hu.months_short.aug}", "${LOCALIZATION.sk.months_short.aug}", "${LOCALIZATION.cs.months_short.aug}"),
            ui_text("${LOCALIZATION.pl.months_short.sep}", "${LOCALIZATION.en.months_short.sep}", "${LOCALIZATION.hu.months_short.sep}", "${LOCALIZATION.sk.months_short.sep}", "${LOCALIZATION.cs.months_short.sep}"), ui_text("${LOCALIZATION.pl.months_short.oct}", "${LOCALIZATION.en.months_short.oct}", "${LOCALIZATION.hu.months_short.oct}", "${LOCALIZATION.sk.months_short.oct}", "${LOCALIZATION.cs.months_short.oct}"),
            ui_text("${LOCALIZATION.pl.months_short.nov}", "${LOCALIZATION.en.months_short.nov}", "${LOCALIZATION.hu.months_short.nov}", "${LOCALIZATION.sk.months_short.nov}", "${LOCALIZATION.cs.months_short.nov}"), ui_text("${LOCALIZATION.pl.months_short.dec}", "${LOCALIZATION.en.months_short.dec}", "${LOCALIZATION.hu.months_short.dec}", "${LOCALIZATION.sk.months_short.dec}", "${LOCALIZATION.cs.months_short.dec}")
          };

          if (component.empty()) return;

          ESPTime dt = id(time_provider).now();
          if (timestamp > 0)
            dt = ESPTime::from_epoch_local(timestamp);

          if (!dt.is_valid()) {
            if (timestamp > 0) {
              ESP_LOGW("${TAG_DATETIME}", "render_date(%s): invalid time from epoch %" PRIu32,
                      component.c_str(), timestamp);
            } else {
              ESP_LOGW("${TAG_DATETIME}", "render_date(%s): time provider not yet synchronized",
                      component.c_str());
            }
            return;
          }

          const int dow = (dt.day_of_week + 5) % 7;
          const int mon = dt.month - 1;

          std::string date_str = id(mui_date_format);
          nspanel_easy::replace_all(date_str, "%A", weekdays[dow]);
          nspanel_easy::replace_all(date_str, "%a", weekdays_short[dow]);
          nspanel_easy::replace_all(date_str, "%B", months[mon]);
          nspanel_easy::replace_all(date_str, "%b", months_short[mon]);
          nspanel_easy::replace_all(date_str, "%-d", to_string(dt.day_of_month).c_str());
          nspanel_easy::replace_all(date_str, "%-m", to_string(dt.month).c_str());

          const std::string date_string = dt.strftime(date_str);
          if (date_string == "ERROR") {
            ESP_LOGW("${TAG_DATETIME}", "render_date(%s): strftime failed - format '%s' (raw: '%s')",
                    component.c_str(), date_str.c_str(), id(mui_date_format).c_str());
            return;
          }
          disp1->set_component_text(component.c_str(), date_string.c_str());

  - id: !extend resync_display
    then:
      - script.execute: refresh_datetime

  - id: !extend stop_all
    then:
      - lambda: |-
          refresh_datetime->stop();
          render_date->stop();

time:  # Keeps time display updated
  - id: time_provider
    platform: homeassistant
    on_time:
      - seconds: 0
        then:
          - script.execute: new_minute

    on_time_sync:
      then:
        - lambda: |-
            ESP_LOGD("${TAG_DATETIME}", "System clock synchronized");
            refresh_datetime->execute();
...
